# Machine-checkable subset of ask-and-tokens-api.md (feature 006; no tokens API since the
# 2026-11-11 amendment: tokens come from `app.cli` commands), checked by
# scripts/validate_contracts.py against the app's OpenAPI schema. The Markdown
# stays the full contract; change both together (docs/contracts.md).
openapi: 3.1.0
info:
  title: Feature 006 contract
  version: 1.0.0
paths:
  /api/ask:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - question
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - answer
                - citations
                - uncovered_part
                - tax_page_line
                - label
