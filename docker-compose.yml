# Local development: `docker compose up -d` starts db, backend and frontend (README, feature 001).
# The database credentials below are local-development-only values, not secrets. The one real
# secret, ANTHROPIC_API_KEY, comes from an uncommitted .env (see .env.example); without it the app
# still runs and only document extraction fails, with a clear reason (feature 003).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pak_tax_filer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pak_tax_filer"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pak_tax_filer
      # Local development runs over plain HTTP; everywhere else the cookie stays HTTPS-only.
      COOKIE_SECURE: "false"
      # Compose reads .env next to this file; empty if there is none.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Uploaded certificates (feature 003, research R4); UPLOAD_DIR defaults to this path.
      - uploads:/data/uploads

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # Host file changes don't raise events inside the container, so Vite polls (vite.config.ts).
      VITE_USE_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep the container's own node_modules (Linux builds) instead of the host's.
      - /app/node_modules

volumes:
  db-data:
  uploads:
